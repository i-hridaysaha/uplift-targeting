[project]
name = "uplift-targeting"
version = "0.1.0"
description = "Causal uplift targeting: estimate the per-customer incremental effect of a treatment and turn it into a budgeted spend policy."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Hriday Saha", email = "i.hridaysaha@gmail.com" }]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
