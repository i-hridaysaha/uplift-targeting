<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1430" width="1520" height="1430" font-family="'Poppins','Avenir Next','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#333333"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#A6A6A6"/></marker>
  </defs>

  <rect x="0" y="0" width="1520" height="1430" fill="#FFFFFF"/>

  <!-- ===== Title ===== -->
  <text x="40" y="60" font-size="34" font-weight="700" fill="#0F0E0E">Uplift Targeting &#8212; Architecture</text>
  <rect x="42" y="72" width="150" height="6" fill="#F0FF00"/>
  <text x="40" y="102" font-size="16" fill="#6E6E6E">From randomized data to a priced who-to-treat policy.</text>

  <!-- ============================================================ BAND 1: DATA ============================================================ -->
  <g>
    <rect x="24" y="120" width="1472" height="176" rx="16" fill="#F6F6F6"/>
    <circle cx="58" cy="162" r="17" fill="#0F0E0E"/>
    <text x="58" y="168" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="86" y="168" font-size="17" font-weight="700" fill="#0F0E0E">Data preparation</text>
    <text x="44" y="204" font-size="12.5" fill="#6E6E6E">Load, map to a binary</text>
    <text x="44" y="222" font-size="12.5" fill="#6E6E6E">treatment, split, and verify</text>
    <text x="44" y="240" font-size="12.5" fill="#6E6E6E">randomization.</text>

    <rect x="300" y="160" width="258" height="104" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="318" y="194" font-size="15" font-weight="700" fill="#0F0E0E">Dataset</text>
    <text x="318" y="218" font-size="12" fill="#6E6E6E">Criteo + Hillstrom raw logs</text>
    <text x="318" y="236" font-size="12" fill="#6E6E6E">scikit-uplift loader + Criteo zip</text>

    <rect x="607" y="160" width="258" height="104" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="625" y="194" font-size="15" font-weight="700" fill="#0F0E0E">Binary treatment</text>
    <text x="625" y="218" font-size="12" fill="#6E6E6E">treated vs control schema</text>
    <text x="625" y="236" font-size="12" fill="#6E6E6E">email arms collapsed to one</text>

    <rect x="915" y="160" width="258" height="104" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="933" y="194" font-size="15" font-weight="700" fill="#0F0E0E">Stratified splits</text>
    <text x="933" y="218" font-size="12" fill="#6E6E6E">5-fold CV + 20% hold-out</text>
    <text x="933" y="236" font-size="12" fill="#6E6E6E">seed 42, arm balance kept</text>

    <rect x="1222" y="160" width="258" height="104" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="1240" y="194" font-size="15" font-weight="700" fill="#0F0E0E">Balance checks</text>
    <text x="1240" y="218" font-size="12" fill="#6E6E6E">SMD per feature</text>
    <text x="1240" y="236" font-size="12" fill="#6E6E6E">both datasets pass</text>

    <line x1="565" y1="212" x2="600" y2="212" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="872" y1="212" x2="908" y2="212" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="1180" y1="212" x2="1215" y2="212" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- connector 1 -> 2 -->
  <line x1="890" y1="304" x2="890" y2="333" stroke="#333333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============================================================ BAND 2: BAKEOFF ============================================================ -->
  <g transform="translate(0,28)">
    <rect x="24" y="312" width="1472" height="214" rx="16" fill="#F6F6F6"/>
    <circle cx="58" cy="354" r="17" fill="#0F0E0E"/>
    <text x="58" y="360" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="86" y="360" font-size="17" font-weight="700" fill="#0F0E0E">Model bakeoff</text>
    <text x="44" y="396" font-size="12.5" fill="#6E6E6E">Fit baselines, meta-</text>
    <text x="44" y="414" font-size="12.5" fill="#6E6E6E">learners, and direct uplift</text>
    <text x="44" y="432" font-size="12.5" fill="#6E6E6E">models on shared splits.</text>
    <text x="44" y="462" font-size="11.5" fill="#9A9A9A">Base learner: LightGBM.</text>

    <rect x="300" y="352" width="366" height="150" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="320" y="386" font-size="15.5" font-weight="700" fill="#0F0E0E">Baselines</text>
    <text x="320" y="404" font-size="11.5" fill="#9A9A9A">the bar every uplift model must clear</text>
    <rect x="320" y="422" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="336" y="429" font-size="13" fill="#0F0E0E">Treat-everyone</text>
    <rect x="320" y="452" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="336" y="459" font-size="13" fill="#0F0E0E">Response model &#8212; P(Y=1)</text>
    <rect x="536" y="447" width="112" height="19" rx="9.5" fill="#F0FF00"/>
    <text x="592" y="460" font-size="10.5" font-weight="700" fill="#0F0E0E" text-anchor="middle">chosen &#183; Hillstrom</text>

    <rect x="707" y="352" width="366" height="150" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="727" y="386" font-size="15.5" font-weight="700" fill="#0F0E0E">Meta-learners</text>
    <text x="727" y="404" font-size="11.5" fill="#9A9A9A">over the shared LightGBM base</text>
    <rect x="727" y="422" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="743" y="429" font-size="13" fill="#0F0E0E">S-learner</text>
    <rect x="727" y="447" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="743" y="454" font-size="13" fill="#0F0E0E">T-learner</text>
    <rect x="727" y="472" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="743" y="479" font-size="13" fill="#0F0E0E">X-learner</text>

    <rect x="1114" y="352" width="366" height="150" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="1134" y="386" font-size="15.5" font-weight="700" fill="#0F0E0E">Direct uplift models</text>
    <text x="1134" y="404" font-size="11.5" fill="#9A9A9A">hand-rolled over LightGBM / numpy</text>
    <rect x="1134" y="422" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="1150" y="429" font-size="13" fill="#0F0E0E">Class transformation</text>
    <rect x="1134" y="447" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="1150" y="454" font-size="13" fill="#0F0E0E">Uplift tree</text>
    <rect x="1134" y="472" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="1150" y="479" font-size="13" fill="#0F0E0E">Uplift forest</text>
    <rect x="1252" y="467" width="98" height="19" rx="9.5" fill="#F0FF00"/>
    <text x="1301" y="480" font-size="10.5" font-weight="700" fill="#0F0E0E" text-anchor="middle">chosen &#183; Criteo</text>
  </g>

  <!-- connector 2 -> 3 -->
  <line x1="890" y1="562" x2="890" y2="591" stroke="#333333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============================================================ BAND 3: EVALUATION ============================================================ -->
  <g transform="translate(0,56)">
    <rect x="24" y="542" width="1472" height="176" rx="16" fill="#F6F6F6"/>
    <circle cx="58" cy="584" r="17" fill="#0F0E0E"/>
    <text x="58" y="590" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="86" y="590" font-size="17" font-weight="700" fill="#0F0E0E">Model evaluation</text>
    <text x="44" y="626" font-size="12.5" fill="#6E6E6E">Rank on cross-validated</text>
    <text x="44" y="644" font-size="12.5" fill="#6E6E6E">uplift metrics; break ties</text>
    <text x="44" y="662" font-size="12.5" fill="#6E6E6E">on the untouched hold-out.</text>

    <rect x="300" y="582" width="258" height="104" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="318" y="616" font-size="15" font-weight="700" fill="#0F0E0E">Qini &#183; AUUC &#183; decile</text>
    <text x="318" y="640" font-size="12" fill="#6E6E6E">cumulative + aggregate uplift</text>
    <text x="318" y="658" font-size="12" fill="#6E6E6E">from-scratch, cross-checked</text>

    <rect x="607" y="582" width="258" height="104" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="625" y="616" font-size="15" font-weight="700" fill="#0F0E0E">CV confidence bands</text>
    <text x="625" y="640" font-size="12" fill="#6E6E6E">5-fold, mean &#177; std</text>
    <text x="625" y="658" font-size="12" fill="#6E6E6E">std is the honest unit</text>

    <rect x="915" y="582" width="258" height="104" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="933" y="616" font-size="15" font-weight="700" fill="#0F0E0E">Hold-out tie-break</text>
    <text x="933" y="640" font-size="12" fill="#6E6E6E">unseen 20% split</text>
    <text x="933" y="658" font-size="12" fill="#6E6E6E">one unbiased number</text>

    <rect x="1222" y="582" width="258" height="104" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="1240" y="616" font-size="15" font-weight="700" fill="#0F0E0E">Selection + drivers</text>
    <text x="1240" y="640" font-size="12" fill="#6E6E6E">winner picked on stability</text>
    <text x="1240" y="658" font-size="12" fill="#6E6E6E">permutation importance</text>

    <line x1="565" y1="634" x2="600" y2="634" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="872" y1="634" x2="908" y2="634" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="1180" y1="634" x2="1215" y2="634" stroke="#333333" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- connector 3 -> strip -->
  <line x1="890" y1="782" x2="890" y2="811" stroke="#333333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============================================================ PRICED-POLICY THESIS STRIP ============================================================ -->
  <g transform="translate(0,84)">
    <rect x="24" y="734" width="1472" height="72" rx="12" fill="#FDFFD6" stroke="#E7E9B0"/>
    <rect x="24" y="734" width="8" height="72" rx="4" fill="#F0FF00"/>
    <text x="52" y="765" font-size="15.5" font-weight="700" fill="#0F0E0E">Priced policy</text>
    <text x="52" y="787" font-size="12.5" fill="#4A4A2E">the thesis &#8212; a ranking + a budget become a decision</text>
    <text x="360" y="762" font-size="13" fill="#0F0E0E">Target top-k by predicted uplift  &#8594;  count incremental conversions off the Qini curve  &#8594;</text>
    <text x="360" y="784" font-size="13" fill="#0F0E0E">price them as a swept net-value <tspan font-weight="700">band</tspan> ($), because value and cost are assumptions, never a single number.</text>
  </g>

  <!-- connector strip -> 4 -->
  <line x1="890" y1="898" x2="890" y2="927" stroke="#333333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ============================================================ BAND 4: DEPLOYMENT ============================================================ -->
  <g transform="translate(0,114)">
    <rect x="24" y="820" width="1472" height="214" rx="16" fill="#F6F6F6"/>
    <circle cx="58" cy="862" r="17" fill="#0F0E0E"/>
    <text x="58" y="868" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="86" y="868" font-size="17" font-weight="700" fill="#0F0E0E">Deployment</text>
    <text x="44" y="904" font-size="12.5" fill="#6E6E6E">Package the winning</text>
    <text x="44" y="922" font-size="12.5" fill="#6E6E6E">policy and serve it via</text>
    <text x="44" y="940" font-size="12.5" fill="#6E6E6E">API and live demo.</text>
    <text x="44" y="970" font-size="11.5" fill="#9A9A9A">One process on a free tier;</text>
    <text x="44" y="986" font-size="11.5" fill="#9A9A9A">demo reads models/ direct.</text>

    <rect x="300" y="858" width="366" height="150" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="320" y="892" font-size="15.5" font-weight="700" fill="#0F0E0E">FastAPI service</text>
    <text x="320" y="922" font-size="13" font-family="'SF Mono','Menlo',monospace" fill="#0F0E0E">/score</text>
    <text x="392" y="922" font-size="12" fill="#6E6E6E">per-customer scores</text>
    <text x="320" y="950" font-size="13" font-family="'SF Mono','Menlo',monospace" fill="#0F0E0E">/policy</text>
    <text x="398" y="950" font-size="12" fill="#6E6E6E">priced value band</text>
    <text x="320" y="978" font-size="13" font-family="'SF Mono','Menlo',monospace" fill="#0F0E0E">/health</text>
    <text x="398" y="978" font-size="12" fill="#6E6E6E">service check</text>

    <rect x="707" y="858" width="366" height="150" rx="10" fill="#FDFFD6" stroke="#E7E9B0"/>
    <rect x="707" y="858" width="8" height="150" rx="4" fill="#F0FF00"/>
    <text x="729" y="892" font-size="15.5" font-weight="700" fill="#0F0E0E">Policy bundle</text>
    <text x="729" y="910" font-size="11.5" fill="#8A8A5A">the shipped artifact (pickle)</text>
    <text x="731" y="936" font-size="13" fill="#0F0E0E">&#10003;  Selected model + preprocessing</text>
    <text x="731" y="962" font-size="13" fill="#0F0E0E">&#10003;  Hold-out reference (live eval)</text>
    <text x="731" y="988" font-size="13" fill="#0F0E0E">&#10003;  Serialized policy &#8212; pickle (.pkl)</text>

    <rect x="1114" y="858" width="366" height="150" rx="10" fill="#FFFFFF" stroke="#E2E2E2"/>
    <text x="1134" y="892" font-size="15.5" font-weight="700" fill="#0F0E0E">Streamlit demo</text>
    <text x="1134" y="910" font-size="11.5" fill="#9A9A9A">live on the untouched hold-out</text>
    <rect x="1134" y="928" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="1150" y="935" font-size="13" fill="#0F0E0E">Score dist &#183; Qini &#183; decile</text>
    <rect x="1134" y="953" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="1150" y="960" font-size="13" fill="#0F0E0E">Budget &amp; value-band sweep</text>
    <rect x="1134" y="978" width="6" height="6" rx="1.5" fill="#F0FF00" stroke="#B9C400"/>
    <text x="1150" y="985" font-size="13" fill="#0F0E0E">Segment what-if</text>

    <line x1="704" y1="933" x2="671" y2="933" stroke="#333333" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="1076" y1="933" x2="1109" y2="933" stroke="#333333" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- connector 4 -> future (dashed) -->
  <line x1="890" y1="1156" x2="890" y2="1185" stroke="#A6A6A6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrG)"/>

  <!-- ============================================================ BAND 5: FUTURE WORK (dimmed) ============================================================ -->
  <g transform="translate(0,142)">
    <rect x="24" y="1050" width="1472" height="170" rx="16" fill="#F0F0F0" stroke="#D8D8D8" stroke-dasharray="6 5"/>
    <circle cx="58" cy="1092" r="17" fill="#F0F0F0" stroke="#B4B4B4" stroke-dasharray="4 3"/>
    <text x="86" y="1098" font-size="17" font-weight="700" fill="#8A8A8A">Future work</text>
    <rect x="86" y="1112" width="120" height="20" rx="10" fill="#E4E4E4"/>
    <text x="146" y="1126" font-size="10.5" font-weight="700" fill="#8A8A8A" text-anchor="middle">NOT BUILT &#183; v1</text>
    <text x="44" y="1162" font-size="12" fill="#A0A0A0">Planned extensions,</text>
    <text x="44" y="1180" font-size="12" fill="#A0A0A0">outside v1 scope.</text>

    <rect x="300" y="1090" width="258" height="104" rx="10" fill="#F0F0F0" stroke="#C8C8C8" stroke-dasharray="5 4"/>
    <text x="318" y="1124" font-size="15" font-weight="700" fill="#8A8A8A">Observational CI</text>
    <text x="318" y="1148" font-size="12" fill="#A0A0A0">propensity weighting, DAGs</text>
    <text x="318" y="1166" font-size="12" fill="#A0A0A0">lift the randomized limit</text>

    <rect x="607" y="1090" width="258" height="104" rx="10" fill="#F0F0F0" stroke="#C8C8C8" stroke-dasharray="5 4"/>
    <text x="625" y="1124" font-size="15" font-weight="700" fill="#8A8A8A">Multi-arm / continuous</text>
    <text x="625" y="1148" font-size="12" fill="#A0A0A0">R-learner, dose response</text>
    <text x="625" y="1166" font-size="12" fill="#A0A0A0">beyond one binary arm</text>

    <rect x="915" y="1090" width="258" height="104" rx="10" fill="#F0F0F0" stroke="#C8C8C8" stroke-dasharray="5 4"/>
    <text x="933" y="1124" font-size="15" font-weight="700" fill="#8A8A8A">Full-Criteo run</text>
    <text x="933" y="1148" font-size="12" fill="#A0A0A0">13.98M rows, not the 1M</text>
    <text x="933" y="1166" font-size="12" fill="#A0A0A0">subsample; tighter bands</text>

    <rect x="1222" y="1090" width="258" height="104" rx="10" fill="#F0F0F0" stroke="#C8C8C8" stroke-dasharray="5 4"/>
    <text x="1240" y="1124" font-size="15" font-weight="700" fill="#8A8A8A">Conversion outcome</text>
    <text x="1240" y="1148" font-size="12" fill="#A0A0A0">the rarer signal, not visit</text>
    <text x="1240" y="1166" font-size="12" fill="#A0A0A0">thinner but higher value</text>
  </g>

  <!-- ===== Legend ===== -->
  <g transform="translate(0,144)">
    <rect x="40" y="1244" width="16" height="16" rx="4" fill="#FDFFD6" stroke="#E7E9B0"/>
    <rect x="40" y="1244" width="5" height="16" rx="2.5" fill="#F0FF00"/>
    <text x="64" y="1257" font-size="12.5" fill="#6E6E6E">policy artifact / priced-policy thesis</text>
    <rect x="360" y="1244" width="16" height="16" rx="4" fill="#F0F0F0" stroke="#C8C8C8" stroke-dasharray="4 3"/>
    <text x="384" y="1257" font-size="12.5" fill="#6E6E6E">future work (not built in v1)</text>
    <text x="640" y="1257" font-size="12.5" fill="#6E6E6E">Chosen: uplift forest (Criteo) &#183; response model (Hillstrom, honest-negative).</text>
  </g>
</svg>
