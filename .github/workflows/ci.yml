name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (pinned by uv.lock)
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Unit tests
        run: uv run pytest
